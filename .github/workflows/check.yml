name: PS5 Pro stock check

on:
  schedule:
    # Belt-and-braces only. GitHub can delay or skip scheduled runs by 5-30 min
    # under load, which is why cron-job.org drives workflow_dispatch every 5 min
    # as the real cadence. check.py guards against the two overlapping.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  # Never let two checks race on committing state.
  group: ps5pro-stock-check
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit the state file back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fetch dependencies
        # curl_cffi: TLS/HTTP2 browser impersonation, required by Fnac + Darty.
        # requests: speaks HTTP/1.1, required by Carrefour and Cdiscount.
        # Both are optional at runtime — a missing wheel degrades those
        # retailers to `unknown` rather than taking the whole run down.
        run: pip install --quiet --disable-pip-version-check curl_cffi requests

      - name: Check stock and notify
        env:
          SMTP_USER:  ${{ secrets.SMTP_USER }}
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          MAIL_TO:    ${{ secrets.MAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: python check.py

      - name: Commit updated state
        run: |
          if [[ -n "$(git status --porcelain .state)" ]]; then
            git config user.name  "ps5pro-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .state
            git commit -m "state: $(date -u +%FT%TZ) [skip ci]"
            # Retry a couple of times if a parallel run pushed just before us.
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              sleep 3
            done
          else
            echo "no state change"
          fi
